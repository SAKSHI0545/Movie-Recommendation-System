<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a class="logo" href="/dashboard">MovieFlix</a>
        <form class="nav-search" action="/search" method="GET">
            <input type="text" name="q" placeholder="Search movies" aria-label="Search movies">
            <button type="submit">Search</button>
        </form>
        <div class="nav-links">
            <a href="/dashboard">Home</a>
            <a href="/favorites">Favorites</a>
            <a href="/watchlist">Watchlist</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <main class="page-shell">
        <section class="movie-section">
            <h1>Movie Library</h1>
            <div class="movie-grid">
                {% for movie in movies %}
                    <article class="movie-card">
                        <a href="{{ movie.detail_url }}">
                            <img src="{{ movie.poster_url }}" alt="{{ movie.title }} poster">
                            <h3>{{ movie.title }}</h3>
                        </a>
                        <p>{{ movie.genre }} | Rating {{ movie.rating }}</p>
                        <div class="card-actions">
                            <a href="{{ url_for('favorite', movie_id=movie.local_id) }}">Favorite</a>
                            <a href="{{ url_for('add_watchlist', movie_id=movie.local_id) }}">Watchlist</a>
                        </div>
                    </article>
                {% else %}
                    <p class="muted">No local movies found. Use search to add TMDB movies to favorites or watchlist.</p>
                {% endfor %}
            </div>
        </section>
    </main>
</body>
</html>
